import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('securityDependencyInventory') {
        doLast {
            def entries = [:]
            def artifacts = [:]
            def collect = { configuration, scope ->
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        def id = component.id
                        def key = "${id.group}:${id.module}:${id.version}".toString()
                        if (!entries.containsKey(key)) entries[key] = [group: id.group, name: id.module, version: id.version, scopes: []]
                        entries[key].scopes.add(scope)
                    }
                }
                configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    artifacts[artifact.file.absolutePath] = [coordinate: artifact.moduleVersion.id.toString(), file: artifact.file.absolutePath]
                }
            }
            ['releaseRuntimeClasspath', 'releaseCompileClasspath', 'releaseUnitTestRuntimeClasspath', 'kaptRelease'].each { name ->
                def c = app.configurations.findByName(name)
                if (c != null && c.canBeResolved) collect(c, name)
            }
            [gradle.rootProject, app].each { project ->
                def c = project.buildscript.configurations.findByName('classpath')
                if (c != null && c.canBeResolved) collect(c, 'build-plugin:' + project.path)
            }
            def directory = new File(gradle.rootProject.projectDir, 'security/evidence')
            directory.mkdirs()
            new File(directory, 'dependencies.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(entries.values().sort { "${it.group}:${it.name}" }))
            def local = new File(gradle.rootProject.projectDir, '.tools/artifact-files.json')
            local.text = JsonOutput.toJson(artifacts.values())
            println "Inventoried ${entries.size()} module versions and ${artifacts.size()} artifacts."
        }
    }
}
